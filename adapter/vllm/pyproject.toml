[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "reqscope-vllm"
version = "0.1.0"
description = "vLLM 0.31.0 plugin for reqscope: engine steps, step membership and request lifecycles"
requires-python = ">=3.10"

[project.entry-points."vllm.general_plugins"]
reqscope = "reqscope_adapter:register"

[tool.setuptools]
packages = ["reqscope_adapter"]
